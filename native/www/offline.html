<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>연결 안 됨</title>
    <style>
      /*
        앱 번들 안에 들어가는 독립 HTML 이라 tokens.css 를 못 읽는다.
        값은 tokens.css 의 다크/라이트 대응값을 그대로 옮겨 적은 것 (--dia-bg, --dia-card 등).
        50-60대 기준: 본문 17px, 터치 타겟 56px.
      */
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f1f5f9;
        --text-dim: #94a3b8;
        --blue: #3b82f6;
        --blue-dark: #2563eb;
        --border: #334155;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f0f4f8;
          --card: #ffffff;
          --text: #0f172a;
          --text-dim: #475569;
          --border: #cbd5e1;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top)) 20px
                 calc(24px + env(safe-area-inset-bottom));
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px 24px;
        text-align: center;
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: rgba(59, 130, 246, 0.14);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        line-height: 1.4;
      }
      p {
        margin: 0 0 28px;
        font-size: 17px;
        line-height: 1.6;
        color: var(--text-dim);
      }
      button {
        width: 100%;
        min-height: 56px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(145deg, var(--blue), var(--blue-dark));
        color: #fff;
        font-size: 17px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        transition: transform 0.12s ease;
      }
      button:active { transform: scale(0.95); }
      button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
      .hint {
        margin: 18px 0 0;
        font-size: 14px;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>인터넷에 연결되지 않았어요</h1>
      <p>
        근무표를 불러오려면 인터넷이 필요해요.<br />
        와이파이나 데이터가 켜져 있는지 확인해주세요.
      </p>
      <button type="button" id="retry">다시 시도하기</button>
      <p class="hint" id="hint">지하 구간에서는 신호가 약할 수 있어요</p>
    </main>
    <script>
      /*
        ★ 스플래시를 여기서도 내려야 한다.
        capacitor.config.ts 는 launchAutoHide:false 라 스플래시를 **웹이** 내린다
        (components/native/NativeBridge). 그런데 이 페이지가 뜨는 상황은 정확히
        "원격 웹이 안 열린" 경우라서 그 코드가 영영 실행되지 않는다.
        내리지 않으면 스플래시가 이 안내 화면을 덮은 채로 남아, 사용자 눈에는
        "앱이 켜지다 멈춤"으로 보인다. 로컬 assets 에도 Capacitor 브릿지가 주입되므로
        window.Capacitor 로 직접 호출할 수 있다.
      */
      try {
        var cap = window.Capacitor;
        if (cap && cap.Plugins && cap.Plugins.SplashScreen) {
          cap.Plugins.SplashScreen.hide();
        }
      } catch (e) {
        /* 브릿지가 없으면(브라우저에서 직접 열람) 내릴 스플래시도 없다 */
      }

      var btn = document.getElementById('retry');
      var hint = document.getElementById('hint');

      btn.addEventListener('click', function () {
        // 오프라인 상태에서 누르면 같은 화면이 다시 떠 "아무 일도 안 일어난 것"처럼 보인다.
        // 연결이 없으면 재시도 대신 그 사실을 말해준다 (CLAUDE.md §5: 다음 행동 안내).
        if (navigator.onLine === false) {
          hint.textContent = '아직 연결이 없어요. 잠시 뒤 다시 눌러주세요';
          return;
        }
        btn.textContent = '연결하는 중…';
        location.replace('https://dia5.kr/');
      });

      // 연결이 돌아오면 사용자가 누르기 전에 알려준다.
      window.addEventListener('online', function () {
        hint.textContent = '연결됐어요. 다시 시도하기를 눌러주세요';
      });
    </script>
  </body>
</html>
